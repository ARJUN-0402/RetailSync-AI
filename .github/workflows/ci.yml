name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff
    - name: Run ruff linter
      run: ruff check src/ tests/ dashboard/ --select E,F --ignore E501

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate pipeline artifacts
      run: |
        python src/data/generate_dataset.py
        python src/data/ingest.py
        python src/database/init_db.py
        python src/features/feature_engineering.py
        python src/forecasting/demand_forecaster.py
        python src/forecasting/forecast_pipeline.py
        python src/inventory/inventory_intelligence.py
        python src/inventory/load_alerts.py
        python src/anomaly/anomaly_detection.py
        python src/clustering/segmentation.py
        python src/clustering/warehouse_optimization.py
    - name: Run pytest
      run: pytest tests/ -v --tb=short
    - name: Run dashboard integration validation
      run: |
        python tests/validate_dashboard_integration.py
    - name: Run end-to-end dashboard test
      run: |
        python tests/test_dashboard_e2e.py

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: retailsync-ai:ci
