name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff
    - name: Run ruff linter
      run: ruff check src/ tests/ dashboard/ --config .ruff.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate pipeline artifacts
      run: |
        python -m src.data.generate_dataset
        python -m src.data.ingest
        python -m src.database.init_db
        python -m src.features.feature_engineering
        python -m src.forecasting.demand_forecaster
        python -m src.forecasting.forecast_pipeline
        python -m src.inventory.inventory_intelligence
        python -m src.inventory.load_alerts
        python -m src.anomaly.anomaly_detection
        python -m src.clustering.segmentation
        python -m src.clustering.warehouse_optimization
    - name: Run pytest
      run: python -m pytest tests/ -v --tb=short
    - name: Run dashboard integration validation
      run: |
        python tests/validate_dashboard_integration.py
    - name: Run end-to-end dashboard test
      run: |
        python tests/test_dashboard_e2e.py

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: retailsync-ai:ci
