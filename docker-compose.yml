version: '3.8'

services:
  retailsync-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailsync-ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./database:/app/database
      - ./docs:/app/docs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import streamlit; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - retailsync-network

networks:
  retailsync-network:
    driver: bridge
