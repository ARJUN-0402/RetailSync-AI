version: '3.8'

services:
  retailsync-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailsync-ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./database:/app/database
      - ./docs:/app/docs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - RETAILSYNC_AI_OFFLINE_MODE=true
    healthcheck:
      test: ["CMD", "python", "-c", "from src.health import get_health_status; raise SystemExit(0 if get_health_status()['status'] in ('healthy', 'degraded') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - retailsync-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

networks:
  retailsync-network:
    driver: bridge
